<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ki Clash · Documentos</title>
<style>
  :root {
    --fondo: #0f172a; --papel: #1e293b; --texto: #e2e8f0;
    --suave: #94a3b8; --acento: #38bdf8; --borde: #334155;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --fondo: #f8fafc; --papel: #ffffff; --texto: #0f172a;
      --suave: #475569; --acento: #0369a1; --borde: #cbd5e1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3rem 1.25rem 4rem;
    background: var(--fondo); color: var(--texto);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 .4rem; }
  p { color: var(--suave); margin: 0 0 1.6rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0 0 .7rem; }
  a {
    display: block; background: var(--papel); border: 1px solid var(--borde);
    border-radius: 10px; padding: .9rem 1.1rem; color: var(--acento);
    text-decoration: none; font-weight: 600;
  }
  a:hover, a:focus-visible { border-color: var(--acento); }
  a span { display: block; color: var(--suave); font-weight: 400; font-size: .88rem; margin-top: .15rem; }
</style>
</head>
<body>
<main>
  <h1>Ki Clash</h1>
  <p>Juego de peleas en dos dimensiones para móvil. Aquí viven los documentos públicos.</p>
  <ul>
    <li>
      <a href="privacidad.html">Política de privacidad
        <span>Qué datos maneja el juego, dónde se quedan y qué puedes hacer con ellos.</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
